name: Build from source.zip

# One-time setup: put THIS file in the repo as .github/workflows/zip-build.yml.
# After that, to build a new version: upload (replace) source.zip in the repo root. Each push that changes source.zip
# unpacks it and runs the same build as build.yml. The module zip is the build's "Artifacts" download.
# This file does not replace build.yml; the project's own .github/workflows/build.yml (inside source.zip) is never used here.

on:
  push:
    paths: ["source.zip"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PLATFORM: android-26

jobs:
  build-from-zip:
    name: Unpack source.zip and build (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Unpack source.zip
        run: |
          test -f source.zip || { echo "::error::source.zip is not in the repository root"; exit 1; }
          rm -rf _unz build_src && mkdir _unz build_src
          unzip -q source.zip -d _unz
          # The project folder is the one that holds module.prop and main.cpp (any folder name, any nesting)
          MP="$(find _unz -name module.prop -not -path '*/META-INF/*' | head -n 1)"
          test -n "$MP" || { echo "::error::no module.prop inside source.zip"; exit 1; }
          SRC="$(dirname "$MP")"
          test -f "$SRC/main.cpp" || { echo "::error::no main.cpp next to module.prop ($SRC)"; exit 1; }
          cp -a "$SRC"/. build_src/
          echo "unpacked: $SRC"
          ls -la build_src

      - name: Fetch build dependencies
        working-directory: build_src
        run: |
          curl -fsSL -o zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          # LSPlt is pinned to a known-good commit (2025-03-26) so a change upstream cannot break or alter the build.
          git clone https://github.com/LSPosed/LSPlt
          git -C LSPlt checkout 7d609ac3c2d8faa0c830b0904024ef5c81a98e6e

      - name: Host tests
        working-directory: build_src
        run: sh tests/run_host_tests.sh

      - name: Configure + compile arm64-v8a
        working-directory: build_src
        run: |
          cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm64 -j"$(nproc)"

      - name: Configure + compile armeabi-v7a (32-bit)
        working-directory: build_src
        run: |
          cmake -B build-arm32 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm32 -j"$(nproc)"

      - name: Read module version
        id: meta
        working-directory: build_src
        run: echo "version=$(sed -n 's/^version=//p' module.prop | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Assemble module package
        working-directory: build_src
        run: |
          mkdir -p out/zygisk
          cp module.prop customize.sh out/
          cp -r webroot META-INF out/
          cp build-arm64/libs/libcodm_tex.so out/zygisk/arm64-v8a.so
          cp build-arm32/libs/libcodm_tex.so out/zygisk/armeabi-v7a.so

      - name: Verify package layout
        working-directory: build_src
        run: |
          for f in module.prop customize.sh META-INF/com/google/android/update-binary META-INF/com/google/android/updater-script webroot/index.html zygisk/arm64-v8a.so zygisk/armeabi-v7a.so; do
            test -f "out/$f" || { echo "MISSING out/$f"; exit 1; }
          done
          grep -q '^id=' out/module.prop && grep -q '^versionCode=' out/module.prop
          MV="$(sed -n 's/^version=//p' module.prop | tr -d '\r')"
          CV="$(sed -n 's/^#define VERSION "\(.*\)".*/\1/p' main.cpp | head -n 1)"
          UV="$(sed -n 's/.*echo .UI: \(v[0-9.]*\).;.*/\1/p' webroot/index.html | head -n 1)"
          echo "module.prop=$MV main.cpp=$CV webui=$UV"
          [ "$MV" = "$CV" ] || { echo "::error::VERSION in main.cpp ($CV) differs from module.prop ($MV)"; exit 1; }
          [ "$MV" = "$UV" ] || { echo "::error::UI version in webroot/index.html ($UV) differs from module.prop ($MV)"; exit 1; }

      - name: Upload module package
        uses: actions/upload-artifact@v6
        with:
          name: codm-blocky-textures-${{ steps.meta.outputs.version }}
          path: build_src/out/
          if-no-files-found: error
