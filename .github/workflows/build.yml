name: Build Alias Manager PWA

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate required PWA files
        run: |
          set -eu
          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f icon-192.png
          test -f icon-512.png

      - name: Package downloadable PWA
        run: |
          mkdir -p dist
          zip -j dist/alias-manager-pwa.zip \
            index.html manifest.json sw.js icon-192.png icon-512.png
          cp index.html manifest.json sw.js icon-192.png icon-512.png dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alias-manager-pwa
          path: dist/*
          if-no-files-found: error
          retention-days: 14
